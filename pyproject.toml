[project]
name = "deep-live-cam"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cv2-enumerate-cameras==1.3.3",
    "insightface==0.7.3",
    "keras>=3.0.0",
    "numpy>=2.0,<3",
    "onnx==1.22.0",
    "onnxruntime==1.23.0 ; platform_machine != 'arm64' and sys_platform == 'darwin'",
    "onnxruntime==1.28.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "onnxruntime-gpu==1.26.0 ; sys_platform != 'darwin'",
    "opencv-python==4.14.0.94",
    "opencv-python-headless==4.14.0.94",
    "opennsfw2==0.18.0",
    "pillow==12.3.0",
    "protobuf>=6.33.5,<8",
    "psutil==7.2.2",
    "pygrabber>=0.2 ; sys_platform == 'win32'",
    "pyside6>=6.7,<7",
    "tqdm>=4.66.3",
    "typing-extensions>=4.15.0",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Deterministic, low-risk rules enforced in CI. Other rules (F841, E402, F821)
# surface real findings but require human judgement to fix safely, so they are
# left out of the gate for now. Intentional side-effect imports should be
# annotated with `# noqa: F401`.
select = ["E701", "E711", "E712", "F401", "F541"]
